name: Boletín diario de café de especialidad

on:
  schedule:
    # 8:03 AM Argentina (UTC-3, sin DST) = 11:03 UTC
    - cron: "3 11 * * *"
  workflow_dispatch: {}

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Cargar prompt en variable de entorno
        run: |
          {
            echo 'NEWSLETTER_PROMPT<<COFFEEEOF'
            cat scripts/coffee_news_prompt.md
            echo 'COFFEEEOF'
          } >> "$GITHUB_ENV"

      - name: Generar contenido del boletín
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.NEWSLETTER_PROMPT }}
          claude_args: --model claude-opus-4-7 --allowedTools "WebSearch,WebFetch,Write,Read"

      - name: Enviar email
        run: python3 scripts/send_email.py ./email.json
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
