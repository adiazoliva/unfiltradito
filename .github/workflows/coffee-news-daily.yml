name: Boletín diario de café de especialidad

on:
  schedule:
    # 4:03 AM Argentina (UTC-3, sin DST) = 7:03 UTC
    # Adelantado para compensar la demora típica de GH Actions (~30-90 min).
    # Con la demora, el mail debería llegar entre las 4:30 y las 6 AM Argentina.
    - cron: "3 7 * * *"
  workflow_dispatch: {}

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Cargar prompt en variable de entorno
        run: |
          {
            echo 'NEWSLETTER_PROMPT<<COFFEEEOF'
            cat scripts/coffee_news_prompt.md
            echo 'COFFEEEOF'
          } >> "$GITHUB_ENV"

      - name: Generar contenido del boletín
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.NEWSLETTER_PROMPT }}
          claude_args: --model claude-opus-4-7 --allowedTools "WebSearch,WebFetch,Write,Read,Edit"

      - name: Enviar email
        run: python3 scripts/send_email.py ./out
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Guardar historial de noticias cubiertas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/covered.md
          if git diff --cached --quiet; then
            echo "Historial sin cambios, nada que commitear."
          else
            git commit -m "Actualizar historial de noticias cubiertas [skip ci]"
            git pull --rebase "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_REF_NAME}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          fi
